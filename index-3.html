<html lang="en"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Gochi+Hand&family=Space+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f8f7f2;--line:#dcdcd4;--ink:#1a1a1a;--mute:#666;--out:#8a8a8a;--outl:#9b9b9b;--y:#f2c23d;--g:#1fa56a;--p:#ff4f93;--b:#2a4fd6;--o:#e8643c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1d1d1b;--line:#2c2c29;--ink:#f1f1ec;--mute:#a5a5a0;--out:#333;--outl:#444}}
:root[data-theme="dark"]{--paper:#1d1d1b;--line:#2c2c29;--ink:#f1f1ec;--mute:#a5a5a0;--out:#333;--outl:#444}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}img{max-width:100%}h1,h2,h3{overflow-wrap:break-word}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{background-color:var(--out);background-image:linear-gradient(var(--outl) 1px,transparent 1px),linear-gradient(90deg,var(--outl) 1px,transparent 1px);background-size:34px 34px;color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden;padding:0 3vw}
.page{max-width:1120px;margin:24px auto;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);box-shadow:0 0 0 1.5px var(--ink);position:relative;overflow-x:clip}
.m{font-family:'Space Mono',monospace;text-transform:uppercase;font-size:.72rem;letter-spacing:.06em}
.hw{font-family:'Gochi Hand','Comic Sans MS',cursive}
.px{font-family:'Pixelify Sans',monospace;font-weight:700}
section{padding:90px 5% 70px;position:relative}
a{color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-bottom:1.5px solid var(--ink);height:50px;padding-right:12px}
nav .l{display:flex;height:100%;align-items:center}
nav .dot{width:22px;height:22px;border-radius:50%;background:var(--p);border:1.5px solid var(--ink);margin:0 14px}
nav ul{display:flex;list-style:none;padding:0;height:100%}
nav li a{display:flex;align-items:center;gap:6px;height:100%;padding:0 14px;text-decoration:none;border-left:1px solid transparent}
nav li a.on{background:var(--y);color:#1a1a1a;border-color:var(--ink);border-right:1px solid var(--ink)}
nav li a:not(.on):hover{background:var(--line)}
.r{display:flex;gap:8px;align-items:center}
.ic{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:.6rem;font-weight:700;text-decoration:none;color:#1a1a1a;font-family:'Space Mono'}
.cbtn{border:1.5px solid var(--ink);padding:5px 14px;text-decoration:none;background:var(--paper)}
.cbtn:hover{background:var(--ink);color:var(--paper)}
.burger{display:none;background:var(--paper);border:1.5px solid var(--ink);width:40px;height:40px;color:var(--ink);font-size:1.2rem}
.chip{display:inline-block;padding:3px 12px;border:1px solid rgba(0,0,0,.25);box-shadow:2px 2px 0 rgba(0,0,0,.2);color:#1a1a1a;transform:rotate(var(--r,0deg))}
.tear{clip-path:polygon(0 6%,3% 0,6% 7%,10% 0,14% 6%,18% 0,22% 7%,27% 0,32% 6%,38% 0,44% 7%,50% 0,56% 6%,62% 0,68% 7%,74% 0,80% 6%,86% 0,92% 7%,97% 0,100% 6%,100% 94%,97% 100%,92% 93%,86% 100%,80% 94%,74% 100%,68% 93%,62% 100%,56% 94%,50% 100%,44% 93%,38% 100%,32% 94%,27% 100%,22% 93%,18% 100%,14% 94%,10% 100%,6% 93%,3% 100%,0 94%);border:0;box-shadow:none}
.y{background:var(--y)}.g{background:var(--g);color:#fff}.p{background:var(--p);color:#fff}.b{background:var(--b);color:#fff}.o{background:var(--o);color:#fff}.t{background:#ead9a8}.mint{background:#a8dcc4}
.hero{text-align:center;padding-top:60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.nbox{position:relative;border:2.5px solid var(--o);border-radius:3px 8px 4px 9px;padding:26px 34px;margin:14px 0;background:var(--paper)}
.nbox h1{font-size:clamp(2.2rem,8.5vw,5.6rem);line-height:.95;letter-spacing:.01em}
.nbox .chip{position:absolute;font-size:.7rem}
.status{display:flex;gap:8px;align-items:center}.status i{width:8px;height:8px;border-radius:50%;background:var(--b)}
.hl{font-size:clamp(1.5rem,4.2vw,2.6rem);font-weight:800;line-height:1.15;max-width:760px;letter-spacing:-.02em}
.intro{max-width:520px;color:var(--mute)}
.btn{display:inline-flex;gap:10px;align-items:center;background:#1a1a1a;color:#fff;padding:10px 18px;text-decoration:none;border:1.5px solid #1a1a1a;transition:.2s;cursor:pointer}
.btn:before{content:"";width:18px;height:18px;background:var(--b);border:1px solid #fff}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--o)}
.btn.w{background:var(--paper);color:var(--ink)}
.curve{display:block;width:100%;height:30px;margin-top:20px}
.lab{position:absolute;top:30px;left:5%;font-size:1.2rem}
.sq{display:inline-block;border:1.5px solid var(--ink);padding:3px 16px;font-size:1.3rem;background:var(--paper);margin-bottom:20px}
.ab{display:grid;grid-template-columns:200px 1fr 200px;gap:30px;align-items:center;text-align:center}
.ab p{font-size:clamp(1.25rem,2.6vw,1.65rem);line-height:1.3;margin-bottom:12px}
.pol{background:#fff;padding:10px 10px 26px;box-shadow:0 5px 14px rgba(0,0,0,.25);position:relative;transform:rotate(var(--r));width:100%;max-width:190px;margin:auto;color:#333;transition:transform .3s}
.pol:hover{transform:rotate(0) scale(1.04)}
.pol .ph{aspect-ratio:4/5;background:repeating-linear-gradient(45deg,#eee 0 8px,#e4e4e4 8px 16px);display:grid;place-items:center;overflow:hidden;font-size:1.2rem;text-align:center;padding:6px}
.pol img{width:100%;height:100%;object-fit:cover}
.pol small{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:.9rem}
.tape{position:absolute;width:56px;height:20px;background:rgba(242,194,61,.7);top:-8px;left:-14px;transform:rotate(-35deg)}
.tape.r2{left:auto;right:-14px;transform:rotate(35deg);background:rgba(120,190,170,.7)}
.tags{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.tags .chip{padding:7px 20px;font-weight:600;font-size:.9rem}
.sh{font-size:clamp(1.8rem,5vw,3rem);margin-bottom:34px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:30px}
.note{background:#fff9d8;color:#1a1a1a;padding:26px 22px 22px;position:relative;box-shadow:3px 4px 0 rgba(0,0,0,.18);transform:rotate(var(--r,0deg));transition:transform .25s}
.note:hover{transform:rotate(0) translateY(-4px)}
.note .n{font-size:2.6rem;line-height:1;color:var(--o)}.note h3{font-size:1.15rem;line-height:1.3;margin:8px 0 4px}.note .hw{font-size:1.3rem}
.sk{background:var(--paper);border:1.5px solid var(--ink);position:relative;transition:transform .25s}
.sk:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--ink)}
.sk h3{padding:7px 14px;border-bottom:1.5px solid var(--ink);color:#1a1a1a}
.sk .in{padding:14px;display:flex;flex-wrap:wrap;gap:9px}
.sk .chip{font-size:.85rem;font-weight:600;padding:3px 10px}.sk .chip em{display:block;font:400 .6rem 'Space Mono';text-transform:uppercase;opacity:.75;font-style:normal}
.dash{border:2px dashed var(--ink);padding:44px 20px;text-align:center;background:var(--paper);position:relative}
.dash .px{font-size:clamp(1.5rem,5vw,2.8rem);margin:8px 0}.dash p{font-size:1.4rem}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:34px}.cg .pol{cursor:pointer;max-width:none}
.cg .pol .ph{aspect-ratio:4/3;background:#fff;padding:0}.cg .pol img{object-fit:contain}.cg .pol{padding-bottom:12px}.cg .pol small{position:static;display:block;margin-top:8px;line-height:1.1}
.modal{overflow:auto;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:14px;color:#fff}.modal img{max-width:100%;max-height:72vh;border:2px solid #fff}
.stack{margin-top:10px}
.tab{display:inline-block;padding:8px 34px 8px 24px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 100%,0 100%);color:#fff;background:var(--b)}
.pc{padding:36px 36px 40px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;position:relative;margin-bottom:-1px}
.pc.dk{background:#1a1a1a;color:#fff}.pc.yl{background:var(--y);color:#1a1a1a}
.pc h3{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.pc .pi{position:relative;border:6px solid #fff;background:#333;min-height:160px}.pc .pi img{width:100%;display:block;max-height:280px;object-fit:cover}
.pc .meta{opacity:.8;margin:12px 0}.pc .lk{display:flex;gap:16px;margin-top:14px}.pc .lk a{border-bottom:1.5px solid currentColor;text-decoration:none}
.ct{text-align:center}.ct .box{background:var(--y);color:#1a1a1a;border:1.5px solid var(--ink);padding:54px 6%;position:relative;box-shadow:8px 8px 0 var(--ink)}
.ct h2{font-size:clamp(2rem,7vw,4.4rem);line-height:1.05;margin:16px 0}.ct p{font-size:1.5rem;line-height:1.2;max-width:520px;margin:0 auto 24px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.row .chip{padding:8px 20px;font-weight:600;text-decoration:none}
footer{text-align:center;padding:30px 5% 36px;border-top:1.5px solid var(--ink);background:var(--paper)}
footer .px{font-size:2.4rem}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.ab>*,.cards>*,.pc>*,.cg>*,.grid>*{min-width:0}
.chip,.pol,.note,.sk,.win,.dash,.box{max-width:100%}
.status{flex-wrap:wrap;justify-content:center;text-align:center}
.nbox{max-width:100%}.nbox h1{overflow-wrap:anywhere}
.pi img,.pol img,.modal img{height:auto}.pol .ph img{height:100%}
@media(min-width:1800px){.page{max-width:1400px}}
@media(max-width:560px){.note,.pol{transform:none}.hero .nbox{width:100%}.ab{gap:16px}.cg{gap:22px}.btn{width:100%;justify-content:center}.hero .btn{width:auto}.sh .chip{font-size:.62rem}}
@media(min-width:1400px){.page{max-width:1280px}body{font-size:17px}.nbox h1{font-size:6.4rem}}
@media(max-width:1000px){body{padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}.page{margin:0;box-shadow:none}}

@media(max-width:560px){.cbtn{display:none}section{padding:60px 5% 44px}.hero{padding-top:44px;gap:14px}.ab p{font-size:1.2rem}.pol{max-width:150px}.note{padding:22px 18px}.pc h3{font-size:1.8rem}.tags .chip{padding:6px 14px}.dash{padding:34px 14px}.row .chip{flex:1 1 40%;text-align:center}}
@media(max-width:360px){body{font-size:15px}.nbox h1{font-size:1.9rem}.ic{display:none}.sk .in{padding:10px}.tab{padding-left:16px}}
@media(hover:none){.sk:hover,.btn:hover{transform:none;box-shadow:none}.note:hover{transform:rotate(var(--r,0deg))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style></head>
